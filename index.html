<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paper Vault - Main Page</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }

    .logo {
      width: 180px;
      height: auto;
      margin-bottom: 1rem;
    }

    .since {
      font-size: 1rem;
      color: #ccc;
      margin-top: 0.5rem;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }

    p {
      text-align: center;
      max-width: 600px;
      font-size: 1.1rem;
      margin-bottom: 2rem;
    }

    .cta-button {
      padding: 1rem 2rem;
      background-color: #f7c948;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: 600;
      color: #1e3c72;
      cursor: pointer;
      margin: 1rem;
      width: 100%;
      max-width: 300px;
      transition: background-color 0.3s ease;
    }

    .cta-button:hover:enabled {
      background-color: #f0b429;
    }

    .cta-button:disabled {
      background-color: #cccccc;
      color: #666666;
      cursor: not-allowed;
    }

    .loading-spinner {
        border: 4px solid #f3f3f3;
        border-top: 4px solid #f7c948;
        border-radius: 50%;
        width: 30px;
        height: 30px;
        animation: spin 1s linear infinite;
        margin: 20px auto;
        display: none;
    }

    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    .flashing-new {
      font-size: 0.85rem;
      color: red;
      animation: flash 1s infinite;
    }

    @keyframes flash {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    footer {
      font-size: 0.9rem;
      color: #ccc;
      width: 100%;
      text-align: center;
      margin-top: 2rem;
      padding-top: 1rem;
    }

    .old-version-link {
      margin-top: 1.5rem;
      font-size: 0.9rem;
      color: #aaa;
      text-align: center;
    }

    .old-version-link a {
      color: #ccc;
      text-decoration: none;
    }

    .old-version-link a:hover {
      text-decoration: underline;
      color: #eee;
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 2rem;
      }

      p {
        font-size: 1rem;
      }

      .cta-button {
        width: 90%;
      }

      footer {
        margin-top: 3rem;
      }
    }

    @media (max-width: 480px) {
      .logo {
        width: 150px;
      }

      h1 {
        font-size: 1.8rem;
      }

      .cta-button {
        padding: 0.8rem 1.5rem;
        font-size: 1rem;
      }

      footer {
        font-size: 0.8rem;
      }
    }
  </style>
</head>
<body>
  <img src="https://raw.githubusercontent.com/papervault/vault/refs/heads/main/logo.png" alt="Paper Vault Logo" class="logo">
  <div class="since">Since 2024</div>
  <h1>Welcome to Paper Vault</h1>
  <p>Your go-to source for Class X papers! Choose from previous years' papers and prelims to help you prepare.</p>
  
  <button class="cta-button" onclick="window.location.href='https://papervault.github.io/cbse-x'">Download Previous 4 Years CBSE Papers</button>
  <button class="cta-button" onclick="window.location.href='https://papervault.github.io/prelims-hancbse/'">Download Previous 2 Years Prelim Papers</button>

  <button class="cta-button" onclick="window.location.href='https://papervault.github.io/sqp/'">
    Sample Papers 2026<br><span class="flashing-new">(NEW)</span>
  </button>

  <footer>
    Website by Arnav Thete | Crafted with love
  </footer>

  <!-- Dull old version button below footer -->
  <div class="old-version-link">
    <a href="https://papervault.github.io/main/">Looking for Old Paper Vault Version 2024? Click here to go to old version</a>
  </div>
</body>
</html>
